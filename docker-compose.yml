# Execução completa: docker compose up --build  →  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: impulso
      POSTGRES_PASSWORD: impulso
      POSTGRES_DB: impulso
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U impulso -d impulso']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: postgresql://impulso:impulso@db:5432/impulso
      PORT: 8080
      WEB_ORIGIN: http://localhost:8080
      # HTTP local: cookies sem a flag Secure. Em produção (HTTPS), use COOKIE_SECURE=true.
      COOKIE_SECURE: 'false'
      SEED_ON_START: 'true'
      # Ambiente DEMONSTRATIVO: cria participantes e jornadas fictícias. Não use em produção real.
      SEED_DEMO_DATA: 'true'
      ALLOW_DEMO_IN_PRODUCTION: 'true'
      SEED_ADMIN_EMAIL: admin@impulso.ai
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Impulso@Demo2026}
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  pgdata:
